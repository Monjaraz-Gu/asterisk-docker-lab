[default]
; Marcación interna directa entre extensiones
exten => _10X,1,Dial(PJSIP/${EXTEN})
exten => _10X,n,Hangup()

; Prueba de Eco
exten => 600,1,Answer()
exten => 600,n,Echo()
exten => 600,n,Hangup()

; Acceso al Menú Interactivo (IVR)
exten => 500,1,Goto(menu-principal,s,1)

; =========================================
; CONTEXTO DEL IVR
; =========================================
[menu-principal]
exten => s,1,Answer()
exten => s,n,Wait(1)
exten => s,n(inicio),Background(welcome)
exten => s,n,WaitExten(10)

; Opción 1: Llama al Celular 1 (101)
exten => 1,1,Dial(PJSIP/101,20)
exten => 1,n,Hangup()

; Opción 2: Llama al Celular 2 (102)
exten => 2,1,Dial(PJSIP/102,20)
exten => 2,n,Hangup()

; Opción 9: Repetir menú
exten => 9,1,Goto(s,inicio)

; Opción inválida
exten => i,1,Playback(invalid)
exten => i,n,Goto(s,inicio)

; Tiempo de espera agotado
exten => t,1,Hangup()
